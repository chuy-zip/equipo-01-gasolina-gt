bundle:
  name: gas_price

include:
  - resources/*.yml

# Databricks solo necesita los notebooks, src/ y databricks/sql. Los datos se leen desde el repo público.
sync:
  exclude:
    - docs/**
    - informe/**
    - data/**
    - .github/**
    - tests/**
    - infra/**
    - scripts/**
    - README.md

# El bundle vive en /Workspace/Shared a propósito: es un ambiente compartido por el equipo.
permissions:
  - level: CAN_MANAGE
    group_name: users

variables:
  catalogo:
    description: Catálogo de Unity Catalog del proyecto. Sigue la convención equipo_XX del enunciado
    default: equipo_01
  esquema_bronze:
    description: Esquema de la capa de bronce
    default: bronze
  esquema_silver:
    description: Esquema de la capa de plata
    default: silver
  esquema_gold:
    description: Esquema de la capa de oro
    default: gold
  ubicacion_bronze:
    description: External location del bucket de bronce
    default: xloc-cusn
  ubicacion_silver:
    description: External location del bucket de plata
    default: xloc-ag
  ubicacion_gold:
    description: External location del bucket de oro
    default: xloc-au
  ubicacion_fotos:
    description: External location donde el catedrático deja las fotos. Es de solo lectura
    default: xloc-raw
  carpeta_fotos:
    description: Carpeta de las fotos dentro de esa ubicación. Vacía es la raíz. Pendiente de confirmar si las fotos nuevas llegan a fotos/AAAA-MM-DD/
    default: ""
  modelo_vision:
    description: Endpoint del modelo de visión que lee los precios de las fotos
    default: databricks-llama-4-maverick
  prefijo_equipo:
    description: Carpeta del equipo dentro de cada bucket, según el enunciado
    default: equipo-01
  repo_raw:
    description: URL base de los archivos crudos del repo en GitHub. De aquí se descargan los datos de data/
    default: https://raw.githubusercontent.com/chuy-zip/equipo-01-gasolina-gt/main
  correo_alertas:
    description: Correo que recibe una alerta si un job falla
    default: chuy.ricardo2@gmail.com

targets:
  prod:
    default: true
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
